<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6363"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <!-- macOS App Squircle (Apple standard 824x824 at 100,100 with rx=185) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bgGrad)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"/>

  <!-- Tilted draft card silhouette in background -->
  <g transform="rotate(-9 470 520)">
    <rect x="255" y="210" width="355" height="550" rx="54" fill="url(#cardGrad)"/>
    <rect x="255" y="210" width="355" height="550" rx="54" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"/>
  </g>

  <!-- Vector path for bold 'F' and 'P' -->
  <g fill="#FFFFFF">
    <!-- F -->
    <path d="M 270 340 L 500 340 L 500 426 L 368 426 L 368 494 L 476 494 L 476 576 L 368 576 L 368 700 L 270 700 Z"/>
    <!-- P -->
    <path d="M 535 340 L 688 340 C 748 340 778 370 778 422 C 778 474 748 504 688 504 L 633 504 L 633 700 L 535 700 Z M 633 428 L 682 428 C 704 428 715 418 715 403 C 715 388 704 378 682 378 L 633 378 Z"/>
  </g>
</svg>
