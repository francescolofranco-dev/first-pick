name: Release

# A push to main that changes VERSION (or a pushed v* tag) publishes a GitHub
# Release for v<VERSION> with a dmg per architecture. When every Apple signing and
# notarization secret is configured the dmgs are signed and notarized; with none
# configured they are published as clearly labelled *-unsigned.dmg files. A partial
# secret set is always an error. Manual runs only produce short-lived artifacts.

on:
  push:
    branches: [ main ]
    paths: [ VERSION ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Decide release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Resolve version and check for an existing release
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(tr -d '[:space:]' < VERSION)"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versions must use MAJOR.MINOR.PATCH (got '$version')." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$version" != "$(tr -d '[:space:]' < VERSION)" ]]; then
            echo "Tag v$version does not match VERSION at that commit." >&2
            exit 1
          fi
          publish=false
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            publish=true
            if gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json assets \
                 --jq '[.assets[].name | select(endswith(".dmg"))] | length' 2>/dev/null | grep -qv '^0$'; then
              echo "::notice::Release v$version already has dmgs; nothing to publish."
              publish=false
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    name: Build dmg (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            jdkArch: aarch64
          - arch: x86_64
            jdkArch: x64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Determine distribution mode
        id: signing
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: |
          values=(
            "$MACOS_CERTIFICATE_P12"
            "$MACOS_CERTIFICATE_PWD"
            "$MACOS_SIGNING_IDENTITY"
            "$NOTARIZATION_APPLE_ID"
            "$NOTARIZATION_PASSWORD"
            "$NOTARIZATION_TEAM_ID"
          )
          present=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then present=$((present + 1)); fi
          done

          if [[ "$present" -ne 0 && "$present" -ne "${#values[@]}" ]]; then
            echo "Apple distribution secrets are only partially configured." >&2
            exit 1
          fi

          configured=false
          if [[ "$present" -eq "${#values[@]}" ]]; then configured=true; fi

          echo "configured=$configured" >> "$GITHUB_OUTPUT"
          if [[ "$configured" == true ]]; then
            echo "label=signed-notarized" >> "$GITHUB_OUTPUT"
          else
            echo "label=unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::No Apple credentials configured; building an unsigned dmg."
          fi

      - name: Install Rosetta (x86_64 cross-build only)
        if: matrix.arch == 'x86_64'
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Set up JDK 21 (${{ matrix.jdkArch }})
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.jdkArch }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Derive version
        id: ver
        shell: bash
        run: echo "version=${{ needs.plan.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          umask 077
          certificate_path="$RUNNER_TEMP/firstpick-signing.p12"
          keychain_path="$RUNNER_TEMP/firstpick-signing.keychain-db"
          keychain_password="$(uuidgen)"

          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CERTIFICATE_PWD" \
            -A -t cert -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          rm -f "$certificate_path"

      - name: Build, sign, and notarize dmg
        if: steps.signing.outputs.configured == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: >-
          ./gradlew notarizeDmg
          -PnativeArchitecture=universal
          -PpackageVersion=${{ steps.ver.outputs.version }}
          -PcomposeJdk="$JAVA_HOME"
          --stacktrace

      - name: Build unsigned dmg
        if: steps.signing.outputs.configured != 'true'
        run: >-
          ./gradlew packageDmg
          -PnativeArchitecture=universal
          -PpackageVersion=${{ steps.ver.outputs.version }}
          -PcomposeJdk="$JAVA_HOME"
          --stacktrace

      - name: Rename dmg per architecture and checksum
        id: dmg
        shell: bash
        run: |
          src="$(find build/compose/binaries -name '*.dmg' -print -quit)"
          if [[ -z "$src" ]]; then echo "No dmg produced" >&2; exit 1; fi

          suffix=""
          if [[ "${{ steps.signing.outputs.configured }}" != true ]]; then
            suffix="-unsigned"
          fi
          out="FirstPick-${{ steps.ver.outputs.version }}-${{ matrix.arch }}${suffix}.dmg"
          mv "$src" "$out"
          shasum -a 256 "$out" > "$out.sha256"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Validate stapled notarization ticket
        if: steps.signing.outputs.configured == 'true'
        run: xcrun stapler validate "${{ steps.dmg.outputs.path }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dmg-${{ matrix.arch }}-${{ steps.signing.outputs.label }}
          path: |
            ${{ steps.dmg.outputs.path }}
            ${{ steps.dmg.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing keychain
        if: always() && steps.signing.outputs.configured == 'true'
        run: |
          rm -f "$RUNNER_TEMP/firstpick-signing.p12"
          security delete-keychain "$RUNNER_TEMP/firstpick-signing.keychain-db" || true

  release:
    name: Publish GitHub Release
    needs: [ plan, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Manual workflow runs are artifact-only. Both architectures must build (and,
    # when credentials exist, pass notarization and staple validation) first.
    if: needs.plan.outputs.publish == 'true'
    steps:
      - name: Download dmg artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: dmg-*
          merge-multiple: true

      - name: Verify release artifact set and checksums
        id: verify
        shell: bash
        run: |
          signed="$(find dist -maxdepth 1 -name '*.dmg' ! -name '*-unsigned.dmg' | wc -l | tr -d ' ')"
          unsigned="$(find dist -maxdepth 1 -name '*-unsigned.dmg' | wc -l | tr -d ' ')"
          if [[ "$((signed + unsigned))" -ne 2 || ( "$signed" -ne 0 && "$unsigned" -ne 0 ) ]]; then
            echo "Expected one dmg per architecture, all signed or all unsigned." >&2
            find dist -maxdepth 1 -type f -print >&2
            exit 1
          fi
          (cd dist && sha256sum --check ./*.sha256)
          if [[ "$unsigned" -ne 0 ]]; then
            {
              echo 'notes<<EOF'
              echo '> [!NOTE]'
              echo '> These dmgs are not notarized by Apple. After dragging FirstPick to Applications, allow it once via **System Settings → Privacy & Security → Open Anyway**, or run:'
              echo '> `xattr -dr com.apple.quarantine "/Applications/FirstPick.app"`'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.plan.outputs.version }}
          body: ${{ steps.verify.outputs.notes }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
